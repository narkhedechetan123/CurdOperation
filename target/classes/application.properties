# ============================================================
# All values below use Spring's ${ENV_VAR:default} syntax.
# If the environment variable is SET, Spring uses it.
# If it's NOT set, Spring falls back to the default after the colon.
# ============================================================

# Chetan Changes

spring.application.name=jwt-crud-demo
server.port=${SERVER_PORT:8088}

# ---------------- Database ----------------
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/jwtcruddb?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---------------- JPA / Hibernate ----------------
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=${SHOW_SQL:true}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# ---------------- JWT ----------------
# jwt.secret MUST be at least 32 characters (256 bits) for HS256.
jwt.secret=${JWT_SECRET:default-dev-secret-key-change-this-in-production-32bytes}
# Expiration in milliseconds. Default here = 24 hours.
jwt.expiration=${JWT_EXPIRATION:86400000}
